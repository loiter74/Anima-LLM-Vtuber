services:
  animetta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ANIMETTA_BUILD_FINGERPRINT: ${ANIMETTA_BUILD_FINGERPRINT:-untracked}
    ports:
      - "80:80"
      - "${ANIMETTA_PORT:-12394}:12394"
    environment:
      - ANIMETTA_PROFILE=${ANIMETTA_PROFILE:-smoke}
      - ANIMETTA_HOST=0.0.0.0
      - ANIMETTA_PORT=12394
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
    volumes:
      - animetta-memory-db:/app/memory_db
      - animetta-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  animetta-memory-db:
  animetta-data:
