<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animetta Live</title>
    <link rel="icon" href="/favicon.svg" />
    <script src="/live2d/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <main class="live-shell">
      <div class="ambient"></div>
      <div class="background" id="liveBackground"></div>
      <div class="vignette"></div>
      <section class="live2d-stage" aria-label="Live2D 舞台">
        <canvas id="live2dCanvas"></canvas>
      </section>
      <section
        class="subtitle-overlay"
        id="subtitleOverlay"
        aria-label="公开字幕"
        aria-live="polite"
        hidden
      >
        <p id="subtitleText"></p>
      </section>
      <aside
        class="public-activity-panel"
        id="publicActivityPanel"
        aria-label="公开行动轨迹"
        hidden
      >
        <header class="public-activity-header">
          <div>
            <div class="public-activity-kicker">AGENCY TRACE</div>
            <h2 class="public-activity-title">行动轨迹</h2>
          </div>
        </header>
        <section
          class="public-narration-state"
          id="publicNarrationState"
          aria-label="当前旁白"
          aria-live="polite"
          hidden
        ></section>
        <dl class="public-activity-summary" aria-label="当前行动摘要">
          <div class="public-activity-summary-slot">
            <dt>当前意图</dt>
            <dd id="publicCurrentIntent">等待任务</dd>
          </div>
          <div class="public-activity-summary-slot">
            <dt>最近观察</dt>
            <dd id="publicRecentObservation">尚无观察</dd>
          </div>
          <div class="public-activity-summary-slot">
            <dt>下一阶段</dt>
            <dd id="publicNextPhase">等待计划</dd>
          </div>
        </dl>
        <ol class="public-activity-list" id="publicActivityList" aria-live="polite"></ol>
      </aside>
      <aside class="status-rail" aria-label="直播状态">
        <span class="status-pill" id="socketStatus" data-state="connecting">服务连接中</span>
        <span class="status-pill" id="livestreamStatus" data-state="stopped">直播未启动</span>
        <span class="status-pill" id="modelStatus" data-state="connecting">Live2D 加载中</span>
        <span
          id="audioStatus"
          data-playback-state="idle"
          data-playback-count="0"
          data-audio-owner="active"
          data-last-audio-task-id=""
          data-last-audio-kind=""
          data-bgm-state="idle"
          data-lip-sync-state="idle"
          data-lip-sync-applied-count="0"
          data-lip-sync-peak="0"
          data-last-lip-sync-task-id=""
          data-last-lip-sync-applied-at=""
          hidden
        ></span>
      </aside>
      <audio id="singingAudio" preload="metadata" hidden></audio>
      <audio id="bgmAudio" preload="auto" hidden></audio>
      <section class="danmaku-panel" id="danmakuPanel" aria-label="实时弹幕">
        <header class="panel-header">
          <div>
            <div class="panel-kicker">LIVE CHAT</div>
            <h1 class="panel-title">实时弹幕</h1>
          </div>
          <span class="message-count" id="messageCount">0</span>
        </header>
        <div class="empty-state" id="emptyState">等待直播弹幕…</div>
        <div class="danmaku-list" id="danmakuList" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/live/main.ts"></script>
  </body>
</html>
