<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animetta Live</title>
    <link rel="icon" href="/favicon.svg" />
    <script src="/live2d/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <main class="live-shell">
      <div class="ambient"></div>
      <div class="background" id="liveBackground"></div>
      <div class="vignette"></div>
      <section class="live2d-stage" aria-label="Live2D 舞台">
        <canvas id="live2dCanvas"></canvas>
      </section>
      <section
        class="subtitle-overlay"
        id="subtitleOverlay"
        aria-label="公开字幕"
        aria-live="polite"
        hidden
      >
        <p id="subtitleText"></p>
      </section>
      <aside class="status-rail" aria-label="直播状态">
        <span class="status-pill" id="socketStatus" data-state="connecting">服务连接中</span>
        <span class="status-pill" id="livestreamStatus" data-state="stopped">直播未启动</span>
        <span class="status-pill" id="modelStatus" data-state="connecting">Live2D 加载中</span>
        <span
          id="audioStatus"
          data-playback-state="idle"
          data-playback-count="0"
          data-last-audio-task-id=""
          data-last-audio-kind=""
          hidden
        ></span>
      </aside>
      <section
        id="singingPlayer"
        class="glass absolute bottom-7 left-7 z-30 w-[min(420px,calc(100vw-56px))] rounded-xl p-4"
        aria-label="唱歌播放器"
        aria-live="polite"
        data-state="idle"
        hidden
      >
        <div class="mb-3 flex items-start gap-3">
          <div class="min-w-0 flex-1">
            <div class="text-[11px] uppercase tracking-[0.16em] text-c-accent">NOW SINGING</div>
            <h2 id="singingTitle" class="m-0 mt-1 truncate text-base font-semibold text-c-text">
              唱歌音频
            </h2>
            <p id="singingIdentity" class="m-0 mt-1 truncate text-xs text-c-text-dim"></p>
          </div>
          <button id="singingPlayButton" class="btn-accent min-w-20" type="button">播放</button>
        </div>
        <audio
          id="singingAudio"
          class="block h-10 w-full"
          aria-label="当前唱歌音频"
          controls
          preload="metadata"
        ></audio>
        <p id="singingPlaybackStatus" class="m-0 mt-2 text-xs text-c-text-dim">已就绪，点击播放</p>
      </section>
      <section class="danmaku-panel" id="danmakuPanel" aria-label="实时弹幕">
        <header class="panel-header">
          <div>
            <div class="panel-kicker">LIVE CHAT</div>
            <h1 class="panel-title">实时弹幕</h1>
          </div>
          <span class="message-count" id="messageCount">0</span>
        </header>
        <div class="empty-state" id="emptyState">等待直播弹幕…</div>
        <div class="danmaku-list" id="danmakuList" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/live/main.ts"></script>
  </body>
</html>
