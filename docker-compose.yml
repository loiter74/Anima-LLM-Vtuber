services:
  animetta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ANIMETTA_BUILD_FINGERPRINT: ${ANIMETTA_BUILD_FINGERPRINT:-untracked}
    ports:
      - "${ANIMETTA_HTTP_PORT:-80}:80"
      - "${ANIMETTA_PORT:-12394}:12394"
    environment:
      - ANIMETTA_PROFILE=${ANIMETTA_PROFILE:-production}
      - ANIMETTA_HOST=0.0.0.0
      - ANIMETTA_PORT=12394
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - QWEN_TTS_API_KEY=${QWEN_TTS_API_KEY:-}
      - QWEN_HOST_TTS_URL=http://host.docker.internal:8767
      - MC_MCP_URL=${MC_MCP_URL:-http://host.docker.internal:8768/mcp}
      - MC_MCP_AUTH_TOKEN=${MC_MCP_AUTH_TOKEN:-}
    volumes:
      - animetta-memory-db:/app/memory_db
      - animetta-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

volumes:
  animetta-memory-db:
  animetta-data:
