services:
  redis:
    image: redis:8.8.1-alpine
    environment:
      REDIS_PASSWORD: ${ANIMETTA_REDIS_PASSWORD:?ANIMETTA_REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --bind 0.0.0.0 --dir /data --pidfile /data/redis.pid --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - animetta-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG && REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --raw COMMAND INFO FT.CREATE | grep -qi ft.create && REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --raw COMMAND INFO JSON.SET | grep -qi json.set"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  animetta:
    image: ${ANIMETTA_IMAGE:-animetta:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ANIMETTA_BUILD_FINGERPRINT: ${ANIMETTA_BUILD_FINGERPRINT:-untracked}
    ports:
      - "${ANIMETTA_HTTP_PORT:-80}:80"
      - "${ANIMETTA_PORT:-12394}:12394"
    environment:
      - ANIMETTA_PROFILE=${ANIMETTA_PROFILE:-production}
      - ANIMETTA_HOST=0.0.0.0
      - ANIMETTA_PORT=12394
      - ANIMETTA_DATA_DIR=/app/data
      - ANIMETTA_ACCESS_TOKEN=${ANIMETTA_ACCESS_TOKEN:?ANIMETTA_ACCESS_TOKEN is required}
      - ANIMETTA_AUTH_USERNAME=${ANIMETTA_AUTH_USERNAME:-admin}
      - ANIMETTA_AUTH_PASSWORD_HASH=${ANIMETTA_AUTH_PASSWORD_HASH:-scrypt-v1:hCKIbfm-qsCRNXImQMlMtQ:Y8LBHJTp-XPsjB0z3Jqs_V3hV8MuGPCVMpN0BsSlcs4}
      - ANIMETTA_REDIS_URL=${ANIMETTA_REDIS_URL:-redis://:${ANIMETTA_REDIS_PASSWORD}@redis:6379/0}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - QWEN_TTS_API_KEY=${QWEN_TTS_API_KEY:-}
      - QWEN_HOST_TTS_URL=http://host.docker.internal:8767
      - RVC_HOST_URL=http://host.docker.internal:8769
      - MC_MCP_URL=${MC_MCP_URL:-http://host.docker.internal:8768/mcp}
      - MC_MCP_AUTH_TOKEN=${MC_MCP_AUTH_TOKEN:-}
    volumes:
      - animetta-memory-db:/app/memory_db
      - animetta-data:/app/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

volumes:
  animetta-memory-db:
  animetta-data:
  animetta-redis:
