services:
  animetta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ANIMETTA_BUILD_FINGERPRINT: ${ANIMETTA_BUILD_FINGERPRINT:-untracked}
    ports:
      - "${ANIMETTA_HTTP_PORT:-80}:80"
      - "${ANIMETTA_PORT:-12394}:12394"
    environment:
      - ANIMETTA_PROFILE=production
      - ANIMETTA_HOST=0.0.0.0
      - ANIMETTA_PORT=12394
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - QWEN_TTS_API_KEY=${QWEN_TTS_API_KEY:-}
      - QWEN_TTS_URL=http://qwen-tts:8766
    volumes:
      - animetta-memory-db:/app/memory_db
      - animetta-data:/app/data
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

volumes:
  animetta-memory-db:
  animetta-data:

networks:
  inference:
    external: true
    name: animetta-inference
