services:
  animetta:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    ports:
      - "80:80"
      - "${ANIMETTA_PORT:-12394}:12394"
    env_file:
      - path: .env
        required: false
    environment:
      - ANIMETTA_HOST=0.0.0.0
      - ANIMETTA_PORT=12394
      - ANIMETTA_LOG_LEVEL=${ANIMETTA_LOG_LEVEL:-INFO}
      - ANIMETTA_CONFIG=/app/config/config.golden.yaml
      - ANIMETTA_DEVICE=cuda
      - ANIMETTA_ASR=mock
      - ANIMETTA_TTS=alice_vc
      - ANIMETTA_LLM=deepseek
      - ANIMETTA_VAD=silero
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - animetta-memory-db:/app/memory_db
      - animetta-data:/app/data
      - ${HF_CACHE_DIR:?Set HF_CACHE_DIR to the host Hugging Face cache}:/root/.cache/huggingface:ro
      - ${ALICE_REF_AUDIO:?Set ALICE_REF_AUDIO to Alice reference WAV}:/app/config/personas/voices/alice_ref.wav:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  animetta-memory-db:
  animetta-data:
