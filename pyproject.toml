[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "animetta"
version = "0.1.0"
description = "AI virtual companion / VTuber framework with Live2D avatar support"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "asyncio: mark test as asyncio",
    "integration: mark as integration test (requires external services)",
    "slow: mark test as slow and potentially hanging (skipped in default CI run)",
    "config_unit: deterministic canonical manifest and EffectiveConfig tests",
    "provider_contract: deterministic remote provider contract tests",
    "real_smoke: real DeepSeek and MiMo validation requiring credentials",
    "production_fault: production-only fault injection and recovery rehearsal",
    "production_soak: ten-minute production acceptance requiring full services",
]
addopts = "-v --tb=short -n auto -m \"not slow and not integration and not real_smoke and not production_fault and not production_soak\" --timeout=30 --timeout-method=thread"

[tool.coverage.run]
source = ["src/animetta"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "ANN001", "ANN201"]
ignore = ["E402", "E501", "UP007"]  # E402: lazy imports intentional, E501: Chinese text, UP007: dynamic Union[tuple()] needed

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use PascalCase for fixtures/class refs and don't follow strict naming
"tests/**/*.py" = ["ANN001", "ANN201", "N803", "N806", "N815", "N802", "N805", "N817", "N811"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
strict = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = false
strict_optional = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.vulture]
min_confidence = 80
paths = ["src/animetta"]
