name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Verification tier
        required: true
        default: full
        type: choice
        options: [quick, affected, full, nightly]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      python_groups: ${{ steps.plan.outputs.python_groups }}
      node_groups: ${{ steps.plan.outputs.node_groups }}
      service_groups: ${{ steps.plan.outputs.service_groups }}
      has_python: ${{ steps.plan.outputs.has_python }}
      has_node: ${{ steps.plan.outputs.has_node }}
      has_service: ${{ steps.plan.outputs.has_service }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      tier: ${{ steps.plan.outputs.tier }}
      cache_mode: ${{ steps.plan.outputs.cache_mode }}
      trust_scope: ${{ steps.plan.outputs.trust_scope }}
      cache_trust: ${{ steps.plan.outputs.cache_trust }}
      docker_services: ${{ steps.plan.outputs.docker_services }}
      has_docker_build: ${{ steps.plan.outputs.has_docker_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install planner dependencies
        run: python -m pip install pydantic pyyaml

      - name: Validate catalog
        run: python -m tooling.quality validate

      - name: Freeze verification plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          HEAD="${{ github.sha }}"
          BASE="$(git rev-parse HEAD^ 2>/dev/null || echo __missing_base__)"

          if [[ "$EVENT" == "pull_request" ]]; then
            TIER="affected"
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ "$EVENT" == "push" ]]; then
            TIER="full"
            BASE="${{ github.event.before }}"
          elif [[ "$EVENT" == "schedule" ]]; then
            TIER="nightly"
          else
            TIER="${{ github.event.inputs.tier }}"
          fi

          mkdir -p artifacts/test-impact/ci
          python -m tooling.quality plan \
            --tier "$TIER" \
            --base-sha "$BASE" \
            --head-sha "$HEAD" \
            --output artifacts/test-impact/ci/plan.json \
            --github-output "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          if [[ "$TIER" == "full" || "$TIER" == "nightly" ]]; then
            echo "cache_mode=off" >> "$GITHUB_OUTPUT"
            echo "trust_scope=release" >> "$GITHUB_OUTPUT"
            echo "cache_trust=release" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "pull_request" ]]; then
            echo "cache_mode=read-write" >> "$GITHUB_OUTPUT"
            echo "trust_scope=pr" >> "$GITHUB_OUTPUT"
            echo "cache_trust=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "cache_mode=read-write" >> "$GITHUB_OUTPUT"
            echo "trust_scope=main" >> "$GITHUB_OUTPUT"
            echo "cache_trust=main" >> "$GITHUB_OUTPUT"
          fi
          echo "### Quality plan: $TIER" >> "$GITHUB_STEP_SUMMARY"
          python -m tooling.quality plan \
            --tier "$TIER" \
            --base-sha "$BASE" \
            --head-sha "$HEAD" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frozen plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci/plan.json
          if-no-files-found: warn
          retention-days: 14

  # ── Fast preflight gate (pull_request only) ───────────────────────────
  # Sub-minute lint + format + (scoped) typecheck on the PR's changed files,
  # so trivially-broken pushes fail in seconds rather than after the matrix
  # jobs boot up. This is deliberately a HARD gate (no continue-on-error):
  # it only checks "obviously broken" — real test coverage stays in the
  # affected-tier matrix below. Skipped on push-to-main (which runs the full
  # tier) and on doc/config-only PRs (paths filter).
  preflight:
    name: preflight
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base ref to diff changed files.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install lint tools (ruff + mypy only)
        run: python -m pip install --upgrade ruff mypy

      - name: Determine changed Python/frontend files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          # Files changed in this PR (added/modified, not deleted).
          mapfile -t ALL < <(git diff --name-only --diff-filter=AM "$BASE" "$GITHUB_SHA")
          printf '%s\n' "${ALL[@]}" | grep -E '^(src|tooling|scripts|evaluations|tests)/.*\.py$' > changed_py.txt || true
          printf '%s\n' "${ALL[@]}" | grep -E '^src/animetta/.*\.py$' > changed_src.txt || true
          printf '%s\n' "${ALL[@]}" | grep -E '^frontend/' > changed_fe.txt || true
          {
            echo "py_count=$(wc -l < changed_py.txt | tr -d ' ')"
            echo "src_count=$(wc -l < changed_src.txt | tr -d ' ')"
            echo "fe_count=$(wc -l < changed_fe.txt | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"

      - name: ruff check (changed Python files)
        if: steps.changed.outputs.py_count != '0'
        run: ruff check $(cat changed_py.txt)

      - name: ruff format --check (changed Python files)
        if: steps.changed.outputs.py_count != '0'
        run: ruff format --check $(cat changed_py.txt)

      # Scoped mypy: only on changed files under src/animetta, only when such
      # files exist. Full-tree mypy stays in the matrix jobs.
      - name: mypy (changed src/animetta files)
        if: steps.changed.outputs.src_count != '0'
        run: mypy $(cat changed_src.txt) --ignore-missing-imports

      - name: Setup pnpm (frontend changed)
        if: steps.changed.outputs.fe_count != '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node (frontend changed)
        if: steps.changed.outputs.fe_count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: prettier --check (frontend changed)
        if: steps.changed.outputs.fe_count != '0'
        run: |
          pnpm --dir frontend install --frozen-lockfile --prefer-offline
          pnpm --dir frontend format:check

  python:
    name: python / ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.python_groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Python verification environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore trust-scoped quality cache
        if: needs.plan.outputs.cache_mode == 'read-write'
        uses: actions/cache@v4
        with:
          path: artifacts/test-impact/cache-v1
          key: quality-v1-${{ runner.os }}-${{ needs.plan.outputs.cache_trust }}-python-${{ matrix.group }}-${{ hashFiles('tooling/quality.yml', 'pyproject.toml', 'requirements*.txt') }}

      - name: Run selected Python group
        run: >-
          python -m tooling.quality run-group "${{ matrix.group }}"
          --plan artifacts/test-impact/ci/plan.json
          --cache "${{ needs.plan.outputs.cache_mode }}"
          --trust-scope "${{ needs.plan.outputs.trust_scope }}"
          --output "artifacts/test-impact/ci/results/${{ matrix.group }}.json"

      - name: Upload structured Python result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-result-python-${{ matrix.group }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci/results/${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Python diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-python-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            junit.xml
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  node:
    name: node / ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.node_groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install pydantic pyyaml

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Restore trust-scoped quality cache
        if: needs.plan.outputs.cache_mode == 'read-write'
        uses: actions/cache@v4
        with:
          path: artifacts/test-impact/cache-v1
          key: quality-v1-${{ runner.os }}-${{ needs.plan.outputs.cache_trust }}-node-${{ matrix.group }}-${{ hashFiles('tooling/quality.yml', 'frontend/pnpm-lock.yaml') }}

      - name: Run selected Node group
        run: >-
          python -m tooling.quality run-group "${{ matrix.group }}"
          --plan artifacts/test-impact/ci/plan.json
          --cache "${{ needs.plan.outputs.cache_mode }}"
          --trust-scope "${{ needs.plan.outputs.trust_scope }}"
          --output "artifacts/test-impact/ci/results/${{ matrix.group }}.json"

      - name: Upload structured Node result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-result-node-${{ matrix.group }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci/results/${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Node diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-node-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            frontend/coverage/
            frontend/test-results/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  service:
    name: service / ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.has_service == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANIMETTA_PROFILE: test
      HF_CACHE_DIR: /tmp/animetta-ci-hf
      ALICE_REF_AUDIO: /tmp/animetta-ci-alice.wav
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.service_groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install pydantic pyyaml

      - name: Prepare Compose-only mount sources
        shell: bash
        run: |
          mkdir -p /tmp/animetta-ci-hf
          touch /tmp/animetta-ci-alice.wav

      - uses: pnpm/action-setup@v4
        if: matrix.group == 'frontend-playwright-smoke'
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        if: matrix.group == 'frontend-playwright-smoke'
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install browser environment
        if: matrix.group == 'frontend-playwright-smoke'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start CPU service stack for fresh browser capture
        if: matrix.group == 'frontend-playwright-smoke'
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.cpu.yml up -d --build
          ready=false
          for attempt in $(seq 1 24); do
            if curl -fsS http://localhost/health | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "$ready" == "true" ]]
          curl -fsS http://localhost/ >/dev/null

      - name: Run selected service group
        run: >-
          python -m tooling.quality run-group "${{ matrix.group }}"
          --plan artifacts/test-impact/ci/plan.json
          --cache "${{ needs.plan.outputs.cache_mode }}"
          --trust-scope "${{ needs.plan.outputs.trust_scope }}"
          --output "artifacts/test-impact/ci/results/${{ matrix.group }}.json"

      - name: Capture service logs
        if: ${{ always() && matrix.group == 'frontend-playwright-smoke' }}
        shell: bash
        run: |
          mkdir -p artifacts/test-impact/ci
          docker compose -f docker-compose.cpu.yml logs --no-color > artifacts/test-impact/ci/service.log
          if grep -E 'Traceback|ERROR|CRITICAL|FATAL' artifacts/test-impact/ci/service.log; then
            rm -f "artifacts/test-impact/ci/results/${{ matrix.group }}.json"
            exit 1
          fi

      - name: Stop service stack
        if: ${{ always() && matrix.group == 'frontend-playwright-smoke' }}
        run: docker compose -f docker-compose.cpu.yml down

      - name: Upload structured service result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-result-service-${{ matrix.group }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci/results/${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload service diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-service-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            smoke-test-homepage.png
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: docker build
    needs: plan
    if: >-
      needs.plan.outputs.has_docker_build == 'true' &&
      needs.plan.outputs.tier != 'full' &&
      needs.plan.outputs.tier != 'nightly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install pydantic pyyaml

      - name: Prepare Compose-only mount sources
        shell: bash
        run: |
          mkdir -p /tmp/animetta-ci-hf artifacts/test-impact/ci
          touch /tmp/animetta-ci-alice.wav
          echo "HF_CACHE_DIR=/tmp/animetta-ci-hf" >> "$GITHUB_ENV"
          echo "ALICE_REF_AUDIO=/tmp/animetta-ci-alice.wav" >> "$GITHUB_ENV"

      - name: Build selected Docker services
        shell: bash
        run: |
          set -euo pipefail
          python -m tooling.quality docker-build \
            --plan artifacts/test-impact/ci/plan.json \
            --json | tee artifacts/test-impact/ci/docker-build.json

      - name: Upload Docker build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-docker-${{ github.run_attempt }}
          path: artifacts/test-impact/ci/docker-build.json
          if-no-files-found: warn
          retention-days: 14

  release-runtime:
    name: production streaming runtime
    needs: plan
    if: >-
      needs.plan.outputs.tier == 'full' ||
      needs.plan.outputs.tier == 'nightly'
    runs-on: [self-hosted, windows, gpu, animetta-release]
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      QWEN_TTS_API_KEY: ${{ secrets.QWEN_TTS_API_KEY }}
      HF_CACHE_DIR: ${{ secrets.HF_CACHE_DIR }}
      ALICE_REF_AUDIO: ${{ secrets.ALICE_REF_AUDIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install pydantic pyyaml python-dotenv

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install fresh browser environment
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Run production streaming startup and acceptance gate
        shell: pwsh
        run: >-
          python scripts/release_runtime_gate.py
          --plan artifacts/test-impact/ci/plan.json
          --output artifacts/test-impact/ci/release-runtime/evidence.json

      - name: Capture failure diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-impact/ci/release-runtime | Out-Null
          docker compose logs --no-color 2>&1 | Out-File -Encoding utf8 artifacts/test-impact/ci/release-runtime/workflow-docker.log
          docker compose -f docker-compose.qwen.yml logs --no-color 2>&1 | Out-File -Encoding utf8 artifacts/test-impact/ci/release-runtime/workflow-qwen-docker.log

      - name: Upload release runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-release-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci/release-runtime/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop production stack
        if: ${{ always() }}
        shell: pwsh
        run: docker compose down --remove-orphans

  quality-gate:
    name: quality-gate
    needs: [plan, python, node, service, docker, release-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-impact/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-result-*-${{ github.run_attempt }}
          merge-multiple: true
          path: artifacts/test-impact/ci/results

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install pydantic pyyaml

      - name: Enforce selected Docker build
        shell: bash
        run: |
          set -euo pipefail
          TIER="${{ needs.plan.outputs.tier }}"
          if [[ "$TIER" == "full" || "$TIER" == "nightly" ]]; then
            if [[ "${{ needs.release-runtime.result }}" != "success" ]]; then
              echo "Cold production runtime gate did not succeed: ${{ needs.release-runtime.result }}" >&2
              exit 1
            fi
          elif [[ "${{ needs.plan.outputs.has_docker_build }}" == "true" && "${{ needs.docker.result }}" != "success" ]]; then
            echo "Selected Docker build did not succeed: ${{ needs.docker.result }}" >&2
            exit 1
          fi

      - name: Aggregate required results
        run: >-
          python -m tooling.quality aggregate
          --plan artifacts/test-impact/ci/plan.json
          --results-dir artifacts/test-impact/ci/results
          --output artifacts/test-impact/ci/summary.json

      - name: Upload aggregate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-impact/ci/plan.json
            artifacts/test-impact/ci/summary.json
            artifacts/test-impact/ci/results/
          if-no-files-found: warn
          retention-days: 30
