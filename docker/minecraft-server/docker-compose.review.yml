services:
  minecraft:
    image: itzg/minecraft-server:java21
    restart: "no"
    ports:
      - "${ANIMETTA_MC_REVIEW_PORT:-25566}:25565"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "false"
      TYPE: "PAPER"
      VERSION: "1.21"
      SEED: "-1334312645"
      MODRINTH_PROJECTS: "paper:spectatorplus:paper-1.2.1"
      DIFFICULTY: "peaceful"
      GAMEMODE: "survival"
      MOTD: "Animetta Disposable Minecraft Review"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      ALLOW_FLIGHT: "true"
      SPAWN_PROTECTION: "0"
      ENABLE_COMMAND_BLOCK: "true"
      MAX_TICK_TIME: "180000"
      MEMORY: "4G"
    volumes:
      - "${ANIMETTA_MC_REVIEW_WORLD_DIR:?review world directory is required}:/data"
