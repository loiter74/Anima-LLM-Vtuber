services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: animetta-mc
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "false"
      VERSION: "1.21.4"
      DIFFICULTY: "normal"
      GAMEMODE: "survival"
      MOTD: "Animetta MC Bot Test Server"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      ALLOW_FLIGHT: "true"
      SPAWN_PROTECTION: "0"
      ENABLE_COMMAND_BLOCK: "true"
      MAX_TICK_TIME: "180000"
      MEMORY: "4G"
    volumes:
      - ./data:/data
