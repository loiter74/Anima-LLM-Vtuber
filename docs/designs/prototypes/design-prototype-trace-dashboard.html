<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animetta Trace Debug Dashboard</title>
  <style>
    :root {
      --c-bg: #1a1028;
      --c-surface: #241538;
      --c-panel: #2d1b45;
      --c-card: #36205a;
      --c-text: #e8e0f0;
      --c-text-dim: #9b8bb0;
      --c-text-muted: #6b5a80;
      --c-accent: #e879a8;
      --c-accent-hover: #f090c0;
      --c-accent-soft: rgba(232, 121, 168, 0.15);
      --c-blue: #7c8cf5;
      --c-mint: #6ee7b7;
      --c-gold: #f5c872;
      --c-violet: #a882ff;
      --c-violet-soft: rgba(168, 130, 255, 0.15);
      --c-success: #4ade80;
      --c-warning: #fbbf24;
      --c-error: #f87171;
      --c-border: rgba(255, 255, 255, 0.08);
      --c-border-accent: rgba(232, 121, 168, 0.30);
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-xl: 16px;
      --r-2xl: 20px;
      --r-full: 9999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Source Han Mono SC", monospace;
      --shadow-panel: 0 20px 48px rgba(0, 0, 0, 0.45);
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.35);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(1000px 520px at 94% -8%, rgba(232, 121, 168, 0.16), transparent 62%),
        radial-gradient(880px 520px at -12% 108%, rgba(124, 140, 245, 0.12), transparent 64%),
        var(--c-bg);
      color: var(--c-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 16px;
      background: rgba(26, 16, 40, 0.72);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--c-border);
    }

    .traffic {
      display: flex;
      gap: 8px;
    }

    .traffic span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .traffic .close { background: #f87171; }
    .traffic .min { background: #fbbf24; }
    .traffic .max { background: #4ade80; }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand span { color: var(--c-accent); }

    .nav {
      display: flex;
      gap: 4px;
    }

    .nav button,
    .icon-button,
    .ghost-button,
    .trace-row,
    .node-card {
      border: 0;
      cursor: pointer;
      transition: transform 180ms var(--ease-out-expo), background 180ms var(--ease-out-expo), border-color 180ms var(--ease-out-expo), color 180ms var(--ease-out-expo), opacity 180ms var(--ease-out-expo);
    }

    .nav button {
      padding: 6px 12px;
      color: var(--c-text-dim);
      background: transparent;
      border-radius: var(--r-md);
      font-size: 12px;
    }

    .nav button.active {
      color: var(--c-accent);
      background: var(--c-accent-soft);
    }

    .runtime {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--c-text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      white-space: nowrap;
    }

    .state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c-success);
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.55);
    }

    .shell {
      min-height: 0;
      display: grid;
      grid-template-columns: 284px minmax(560px, 1fr) 380px;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      min-height: 0;
      background: rgba(36, 21, 56, 0.70);
      backdrop-filter: blur(24px);
      border: 1px solid var(--c-border);
      border-radius: var(--r-2xl);
      box-shadow: var(--shadow-panel);
      overflow: hidden;
    }

    .trace-list {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .panel-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--c-border);
    }

    .panel-title {
      margin: 0;
      color: var(--c-text);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .panel-sub {
      margin: 4px 0 0;
      color: var(--c-text-muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .trace-items {
      overflow: auto;
      padding: 8px;
    }

    .trace-row {
      width: 100%;
      display: grid;
      gap: 7px;
      padding: 11px 10px;
      margin-bottom: 6px;
      text-align: left;
      color: var(--c-text-dim);
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid transparent;
      border-radius: var(--r-lg);
    }

    .trace-row:hover,
    .node-card:hover,
    .ghost-button:hover,
    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--c-border-accent);
      background: rgba(232, 121, 168, 0.075);
    }

    .trace-row.active {
      color: var(--c-text);
      border-color: var(--c-border-accent);
      background: rgba(232, 121, 168, 0.11);
    }

    .trace-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .trace-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--c-text-muted);
    }

    .trace-prompt {
      font-size: 12px;
      line-height: 1.35;
      color: inherit;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 4px 8px;
      border-radius: var(--r-full);
      border: 1px solid var(--c-border);
      background: rgba(255, 255, 255, 0.035);
      color: var(--c-text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.success {
      color: var(--c-success);
      border-color: rgba(74, 222, 128, 0.28);
      background: rgba(74, 222, 128, 0.06);
    }

    .status-badge.warning {
      color: var(--c-warning);
      border-color: rgba(251, 191, 36, 0.28);
      background: rgba(251, 191, 36, 0.06);
    }

    .status-badge.error {
      color: var(--c-error);
      border-color: rgba(248, 113, 113, 0.30);
      background: rgba(248, 113, 113, 0.06);
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .trace-toolbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--c-border);
    }

    .nav-cluster {
      display: flex;
      gap: 8px;
    }

    .icon-button,
    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--c-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--c-text-dim);
      border-radius: var(--r-lg);
    }

    .icon-button {
      width: 38px;
      height: 38px;
      font-family: var(--font-mono);
      font-size: 16px;
    }

    .ghost-button {
      min-height: 38px;
      padding: 0 12px;
      font-size: 12px;
    }

    .icon-button:disabled,
    .ghost-button:disabled {
      opacity: 0.38;
      cursor: default;
      transform: none;
    }

    .trace-heading {
      min-width: 0;
    }

    .trace-heading h1 {
      margin: 0;
      color: var(--c-text);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trace-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(78px, 1fr));
      gap: 8px;
      min-width: 370px;
    }

    .metric {
      padding: 8px 10px;
      border-radius: var(--r-lg);
      border: 1px solid var(--c-border);
      background: rgba(255, 255, 255, 0.025);
    }

    .metric b {
      display: block;
      color: var(--c-text);
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .metric span {
      display: block;
      margin-top: 3px;
      color: var(--c-text-muted);
      font-size: 10px;
    }

    .flow-wrap {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .flow-canvas {
      position: relative;
      min-width: 860px;
      min-height: 420px;
      height: 100%;
      border-radius: var(--r-xl);
      border: 1px solid var(--c-border);
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        rgba(26, 16, 40, 0.28);
      background-size: 32px 32px;
      overflow: hidden;
    }

    .edge-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .edge-layer path {
      fill: none;
      stroke: rgba(155, 139, 176, 0.42);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .edge-layer path.active { stroke: rgba(232, 121, 168, 0.72); }
    .edge-layer path.success { stroke: rgba(74, 222, 128, 0.58); }
    .edge-layer path.warning { stroke: rgba(251, 191, 36, 0.72); }
    .edge-layer path.error { stroke: rgba(248, 113, 113, 0.78); }

    .node-card {
      position: absolute;
      width: 150px;
      min-height: 92px;
      padding: 12px;
      color: var(--c-text-dim);
      background: rgba(36, 21, 56, 0.90);
      border: 1px solid var(--c-border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-soft);
      text-align: left;
    }

    .node-card.selected {
      color: var(--c-text);
      border-color: var(--c-border-accent);
      box-shadow: 0 0 0 3px rgba(232, 121, 168, 0.12), var(--shadow-soft);
    }

    .node-card.success {
      border-color: rgba(74, 222, 128, 0.32);
    }

    .node-card.warning {
      border-color: rgba(251, 191, 36, 0.40);
    }

    .node-card.error {
      border-color: rgba(248, 113, 113, 0.55);
      background: rgba(63, 30, 54, 0.94);
    }

    .node-card.skipped {
      opacity: 0.54;
      color: var(--c-text-muted);
      background: rgba(36, 21, 56, 0.48);
    }

    .node-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--c-text);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .node-time {
      font-family: var(--font-mono);
      color: var(--c-text-muted);
      font-size: 10px;
      font-weight: 500;
    }

    .node-copy {
      margin-top: 8px;
      color: inherit;
      font-size: 11px;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .node-status {
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--c-text-muted);
    }

    .node-status.success { color: var(--c-success); }
    .node-status.warning { color: var(--c-warning); }
    .node-status.error { color: var(--c-error); }

    .flow-footer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-top: 1px solid var(--c-border);
    }

    .io-panel {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .io-block {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      background: rgba(255, 255, 255, 0.025);
    }

    .io-block span {
      display: block;
      color: var(--c-text-muted);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .io-block p {
      margin: 0;
      color: var(--c-text-dim);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .detail-body {
      overflow: auto;
      padding: 14px;
    }

    .detail-card {
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid var(--c-border);
      border-radius: var(--r-xl);
      background: rgba(255, 255, 255, 0.025);
    }

    .detail-card h3 {
      margin: 0 0 9px;
      color: var(--c-text);
      font-size: 12px;
      font-weight: 700;
    }

    .detail-card p {
      margin: 0;
      color: var(--c-text-dim);
      font-size: 12px;
      line-height: 1.5;
    }

    .kv {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 6px 10px;
      font-size: 12px;
    }

    .kv dt {
      color: var(--c-text-muted);
    }

    .kv dd {
      margin: 0;
      min-width: 0;
      color: var(--c-text-dim);
      font-family: var(--font-mono);
      overflow-wrap: anywhere;
    }

    .event-list {
      display: grid;
      gap: 8px;
    }

    .event-row {
      display: grid;
      grid-template-columns: 66px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 8px;
      border-radius: var(--r-md);
      background: rgba(255, 255, 255, 0.025);
    }

    .event-row time {
      font-family: var(--font-mono);
      color: var(--c-text-muted);
      font-size: 10px;
    }

    .event-row span {
      color: var(--c-text-dim);
      font-size: 12px;
      line-height: 1.35;
    }

    pre {
      margin: 0;
      color: var(--c-text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1180px) {
      .shell {
        grid-template-columns: 248px minmax(520px, 1fr);
      }

      .detail {
        grid-column: 1 / -1;
        min-height: 360px;
      }
    }

    @media (max-width: 820px) {
      .titlebar {
        gap: 10px;
      }

      .nav button:nth-child(1),
      .nav button:nth-child(2) {
        display: none;
      }

      .runtime {
        display: none;
      }

      .shell {
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
      }

      .trace-list,
      .workspace,
      .detail {
        min-height: 360px;
      }

      .trace-toolbar,
      .flow-footer {
        grid-template-columns: 1fr;
      }

      .metric-strip,
      .io-panel {
        grid-template-columns: 1fr 1fr;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="titlebar">
      <div class="traffic" aria-hidden="true">
        <span class="close"></span>
        <span class="min"></span>
        <span class="max"></span>
      </div>
      <div class="brand">Animetta<span>.</span></div>
      <nav class="nav" aria-label="Main sections">
        <button>Chat</button>
        <button>Memory</button>
        <button class="active">Trace</button>
        <button>Settings</button>
      </nav>
      <div class="runtime">
        <span class="state-dot"></span>
        CONNECTED 14 ms
      </div>
    </header>

    <section class="shell" aria-label="Trace debug dashboard">
      <aside class="panel trace-list">
        <div class="panel-head">
          <h2 class="panel-title">历史 Trace</h2>
          <p class="panel-sub">按完成时间倒序，默认打开最新一次对话。</p>
        </div>
        <div id="traceList" class="trace-items"></div>
      </aside>

      <section class="panel workspace">
        <div class="trace-toolbar">
          <div class="nav-cluster">
            <button id="olderBtn" class="icon-button" aria-label="更旧的 trace">←</button>
            <button id="newerBtn" class="icon-button" aria-label="更新的 trace">→</button>
            <button id="latestBtn" class="ghost-button">最新一次</button>
          </div>

          <div class="trace-heading">
            <h1 id="traceTitle">Trace Debug Dashboard</h1>
            <div id="traceMeta" class="trace-meta"></div>
          </div>

          <div class="metric-strip">
            <div class="metric"><b id="metricDuration">0 ms</b><span>总耗时</span></div>
            <div class="metric"><b id="metricNodes">0</b><span>执行节点</span></div>
            <div class="metric"><b id="metricTokens">0</b><span>Tokens</span></div>
            <div class="metric"><b id="metricStatus">OK</b><span>状态</span></div>
          </div>
        </div>

        <div class="flow-wrap">
          <div class="flow-canvas">
            <svg class="edge-layer" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
                  <path d="M 0 0 L 8 4 L 0 8 z" fill="rgba(155, 139, 176, 0.72)"></path>
                </marker>
              </defs>
              <path id="edge-input-personality" d="M 128 197 C 165 197, 178 197, 215 197" marker-end="url(#arrow)"></path>
              <path id="edge-personality-llm" d="M 365 197 C 402 197, 418 197, 455 197" marker-end="url(#arrow)"></path>
              <path id="edge-llm-humor" d="M 605 197 C 642 197, 658 197, 695 197" marker-end="url(#arrow)"></path>
              <path id="edge-humor-tts" d="M 845 197 C 878 197, 888 197, 920 197" marker-end="url(#arrow)"></path>
              <path id="edge-tts-emotion" d="M 995 235 C 940 324, 842 342, 790 326" marker-end="url(#arrow)"></path>
              <path id="edge-emotion-output" d="M 640 326 C 565 326, 508 326, 433 326" marker-end="url(#arrow)"></path>
              <path id="edge-llm-tools" d="M 530 238 C 530 272, 530 284, 530 318" marker-end="url(#arrow)"></path>
              <path id="edge-tools-llm" d="M 455 346 C 395 346, 368 280, 455 224" marker-end="url(#arrow)"></path>
            </svg>
            <div id="flowNodes"></div>
          </div>
        </div>

        <footer class="flow-footer">
          <div class="io-panel">
            <div class="io-block">
              <span>用户输入</span>
              <p id="inputSummary"></p>
            </div>
            <div class="io-block">
              <span>最终输出</span>
              <p id="outputSummary"></p>
            </div>
          </div>
          <button class="ghost-button">全量重试当前输入</button>
        </footer>
      </section>

      <aside class="panel detail">
        <div class="panel-head">
          <h2 id="detailTitle" class="panel-title">节点详情</h2>
          <p id="detailSub" class="panel-sub"></p>
        </div>
        <div id="detailBody" class="detail-body"></div>
      </aside>
    </section>
  </main>

  <script>
    const topology = [
      { id: "input", label: "Input", x: 3, y: 35 },
      { id: "personality", label: "Personality", x: 24, y: 35 },
      { id: "llm", label: "LLM", x: 48, y: 35 },
      { id: "tools", label: "Tools", x: 48, y: 70 },
      { id: "humor", label: "Humor", x: 72, y: 35 },
      { id: "tts", label: "TTS", x: 90, y: 35 },
      { id: "emotion", label: "Emotion", x: 66, y: 70 },
      { id: "output", label: "Output", x: 30, y: 70 }
    ];

    const traces = [
      {
        id: "tr_20260708_2241_7c91",
        title: "最新一次完成的对话",
        time: "2026-07-08 22:41:16",
        status: "error",
        inputType: "text",
        duration: 2860,
        tokens: 1432,
        input: "把刚才那段话用更元气的语气说一遍",
        output: "TTS 合成失败，前端收到 conversation-end 前没有音频 payload。",
        nodes: {
          input: { status: "success", duration: 0, output: "text input accepted", input: "Socket.IO chat.text", attributes: { input_type: "text", channel_id: "desktop" }, events: ["received chat.text", "created trace"] },
          personality: { status: "success", duration: 18, output: "persona loaded: sakurai-ori", input: "session config v18", attributes: { persona: "sakurai-ori", mode: "companion" }, events: ["loaded persona", "merged system prompt"] },
          llm: { status: "success", duration: 1214, output: "当然可以！那我就换成超有活力的版本啦...", input: "user_text + memory context", attributes: { provider: "openai", model: "gpt-4o-mini", input_tokens: 1034, output_tokens: 398, timeout_ms: 30000 }, events: ["memory context attached", "llm request sent", "llm response received"] },
          tools: { status: "skipped", duration: 0, output: "no tool calls", input: "tool_calls: []", attributes: { call_count: 0 }, events: [] },
          humor: { status: "success", duration: 83, output: "元气语气校正通过", input: "llm response text", attributes: { rewrite_applied: true, validation_score: 0.82 }, events: ["rewrite complete", "validation pass"] },

          emotion: { status: "skipped", duration: 0, output: "not reached", input: "tts_audio missing", attributes: {}, events: [] },
          output: { status: "warning", duration: 77, output: "sent text only, audio missing", input: "response_text without tts_audio", attributes: { socket_events: ["chat.sentence", "chat.control"], audio_sent: false }, events: ["sent sentence", "sent conversation-end"] }
        }
      },
      {
        id: "tr_20260708_2238_318a",
        title: "上一次对话",
        time: "2026-07-08 22:38:02",
        status: "success",
        inputType: "text",
        duration: 1794,
        tokens: 987,
        input: "今天的记忆系统状态怎么样？",
        output: "记忆系统在线，最近写入正常，检索命中率看起来也很稳定。",
        nodes: {
          input: { status: "success", duration: 0, output: "text input accepted", input: "Socket.IO chat.text", attributes: { input_type: "text" }, events: ["received chat.text", "created trace"] },
          personality: { status: "success", duration: 15, output: "persona loaded", input: "session config v18", attributes: { persona: "sakurai-ori" }, events: ["loaded persona"] },
          llm: { status: "success", duration: 908, output: "记忆系统在线，最近写入正常...", input: "user_text + memory context", attributes: { provider: "openai", model: "gpt-4o-mini", input_tokens: 744, output_tokens: 243, memory_hits: 5 }, events: ["memory retrieval: 5 hits", "llm response received"] },
          tools: { status: "skipped", duration: 0, output: "no tool calls", input: "tool_calls: []", attributes: { call_count: 0 }, events: [] },
          humor: { status: "success", duration: 61, output: "tone preserved", input: "llm response text", attributes: { rewrite_applied: false }, events: ["validation pass"] },
          tts: { status: "success", duration: 521, output: "wav audio generated", input: "42 chars", attributes: { provider: "vibevoice", voice: "ori", text_chars: 42, audio_format: "wav" }, events: ["cleaned text", "audio generated"] },
          emotion: { status: "success", duration: 41, output: "neutral", input: "response_text", attributes: { emotion: "neutral", vad: [0.15, 0.3, 0.22] }, events: ["emotion analyzed"] },
          output: { status: "success", duration: 248, output: "text and audio emitted", input: "response_text + tts_audio", attributes: { audio_sent: true, volumes: 128 }, events: ["sent sentence", "sent audio_with_expression", "stored memory"] }
        }
      },
      {
        id: "tr_20260708_2231_b4ef",
        title: "上上次对话",
        time: "2026-07-08 22:31:44",
        status: "warning",
        inputType: "audio",
        duration: 4112,
        tokens: 1188,
        input: "音频输入 3.2s，ASR 转写为：帮我总结一下刚才的讨论",
        output: "已经总结完成，但 memory 写入超时，未影响回复发送。",
        nodes: {
          input: { status: "success", duration: 0, output: "audio input accepted", input: "Socket.IO chat.audio", attributes: { input_type: "audio", audio_ms: 3200 }, events: ["received audio", "created trace"] },
          personality: { status: "success", duration: 17, output: "persona loaded", input: "session config v18", attributes: { persona: "sakurai-ori" }, events: ["loaded persona"] },
          llm: { status: "success", duration: 1317, output: "我们刚才主要确定了 trace dashboard 的第一期范围...", input: "asr_text + memory context", attributes: { provider: "openai", model: "gpt-4o-mini", input_tokens: 902, output_tokens: 286, memory_hits: 7 }, events: ["asr transcript attached", "memory retrieval: 7 hits", "llm response received"] },
          tools: { status: "skipped", duration: 0, output: "no tool calls", input: "tool_calls: []", attributes: { call_count: 0 }, events: [] },
          humor: { status: "success", duration: 74, output: "summary tone accepted", input: "llm response text", attributes: { validation_score: 0.76 }, events: ["validation pass"] },
          tts: { status: "success", duration: 1680, output: "wav audio generated", input: "118 chars", attributes: { provider: "vibevoice", voice: "ori", text_chars: 118, audio_format: "wav" }, events: ["cleaned text", "audio generated"] },
          emotion: { status: "success", duration: 46, output: "thinking", input: "response_text", attributes: { emotion: "thinking" }, events: ["emotion analyzed"] },
          output: { status: "warning", duration: 978, output: "reply sent, memory write timeout", input: "response_text + tts_audio", attributes: { audio_sent: true, memory_status: "timeout", error_type: "MemoryWriteTimeout" }, events: ["sent sentence", "sent audio_with_expression", "memory write timeout"] }
        }
      }
    ];

    let traceIndex = 0;
    let selectedNodeId = "tts";

    function statusClass(status) {
      if (status === "error") return "error";
      if (status === "warning") return "warning";
      if (status === "success") return "success";
      return "";
    }

    function statusText(status) {
      return {
        success: "SUCCESS",
        warning: "WARN",
        error: "ERROR",
        skipped: "SKIPPED"
      }[status] || "UNKNOWN";
    }

    function renderTraceList() {
      const list = document.getElementById("traceList");
      list.innerHTML = traces.map((trace, index) => `
        <button class="trace-row ${index === traceIndex ? "active" : ""}" data-trace-index="${index}">
          <div class="trace-line">
            <span class="trace-time">${trace.time.slice(11)}</span>
            <span class="status-badge ${statusClass(trace.status)}">${statusText(trace.status)}</span>
          </div>
          <div class="trace-prompt">${trace.input}</div>
          <div class="trace-line">
            <span class="trace-time">${trace.duration} ms</span>
            <span class="trace-time">${trace.inputType}</span>
          </div>
        </button>
      `).join("");
      list.querySelectorAll(".trace-row").forEach(button => {
        button.addEventListener("click", () => {
          traceIndex = Number(button.dataset.traceIndex);
          selectedNodeId = preferredNode(traces[traceIndex]);
          renderAll();
        });
      });
    }

    function preferredNode(trace) {
      const error = Object.entries(trace.nodes).find(([, node]) => node.status === "error");
      if (error) return error[0];
      const warning = Object.entries(trace.nodes).find(([, node]) => node.status === "warning");
      if (warning) return warning[0];
      return "llm";
    }

    function renderHeader() {
      const trace = traces[traceIndex];
      document.getElementById("traceTitle").textContent = `${trace.title} · ${trace.id}`;
      document.getElementById("traceMeta").innerHTML = `
        <span class="status-badge ${statusClass(trace.status)}">${statusText(trace.status)}</span>
        <span class="status-badge">${trace.time}</span>
        <span class="status-badge">${trace.inputType}</span>
      `;
      document.getElementById("metricDuration").textContent = `${trace.duration} ms`;
      document.getElementById("metricNodes").textContent = Object.values(trace.nodes).filter(node => node.status !== "skipped").length;
      document.getElementById("metricTokens").textContent = trace.tokens;
      document.getElementById("metricStatus").textContent = statusText(trace.status);
      document.getElementById("inputSummary").textContent = trace.input;
      document.getElementById("outputSummary").textContent = trace.output;
      document.getElementById("olderBtn").disabled = traceIndex >= traces.length - 1;
      document.getElementById("newerBtn").disabled = traceIndex <= 0;
    }

    function renderGraph() {
      const trace = traces[traceIndex];
      document.getElementById("flowNodes").innerHTML = topology.map(item => {
        const node = trace.nodes[item.id] || { status: "skipped", duration: 0, output: "not present" };
        return `
          <button
            class="node-card ${statusClass(node.status)} ${node.status === "skipped" ? "skipped" : ""} ${selectedNodeId === item.id ? "selected" : ""}"
            style="left:${item.x}%; top:${item.y}%;"
            data-node-id="${item.id}"
          >
            <span class="node-name">${item.label}<span class="node-time">${node.duration} ms</span></span>
            <span class="node-copy">${node.output}</span>
            <span class="node-status ${statusClass(node.status)}">${statusText(node.status)}</span>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".node-card").forEach(button => {
        button.addEventListener("click", () => {
          selectedNodeId = button.dataset.nodeId;
          renderGraph();
          renderDetail();
        });
      });

      const activeEdges = {
        "edge-input-personality": trace.nodes.input.status,
        "edge-personality-llm": trace.nodes.personality.status,
        "edge-llm-tools": trace.nodes.tools.status,
        "edge-tools-llm": trace.nodes.tools.status,
        "edge-llm-humor": trace.nodes.llm.status,
        "edge-humor-tts": trace.nodes.humor.status,
        "edge-tts-emotion": trace.nodes.tts.status,
        "edge-emotion-output": trace.nodes.emotion.status
      };

      Object.entries(activeEdges).forEach(([edgeId, status]) => {
        const edge = document.getElementById(edgeId);
        edge.className.baseVal = status === "skipped" ? "" : `active ${statusClass(status)}`;
      });
    }

    function renderDetail() {
      const trace = traces[traceIndex];
      const node = trace.nodes[selectedNodeId];
      const topologyNode = topology.find(item => item.id === selectedNodeId);
      document.getElementById("detailTitle").textContent = topologyNode.label;
      document.getElementById("detailSub").textContent = `${statusText(node.status)} · ${node.duration} ms · ${trace.id}`;
      document.getElementById("detailBody").innerHTML = `
        <section class="detail-card">
          <h3>Overview</h3>
          <dl class="kv">
            <dt>Status</dt><dd>${statusText(node.status)}</dd>
            <dt>Duration</dt><dd>${node.duration} ms</dd>
            <dt>Node</dt><dd>${selectedNodeId}</dd>
            <dt>Trace</dt><dd>${trace.id}</dd>
          </dl>
        </section>
        <section class="detail-card">
          <h3>Input</h3>
          <p>${node.input || "empty"}</p>
        </section>
        <section class="detail-card">
          <h3>Output</h3>
          <p>${node.output || "empty"}</p>
        </section>
        <section class="detail-card">
          <h3>Events</h3>
          <div class="event-list">
            ${(node.events || []).length ? node.events.map((event, index) => `
              <div class="event-row">
                <time>+${String(index * 120).padStart(3, "0")} ms</time>
                <span>${event}</span>
              </div>
            `).join("") : `<div class="event-row"><time>0 ms</time><span>No events recorded</span></div>`}
          </div>
        </section>
        <section class="detail-card">
          <h3>Attributes</h3>
          <pre>${JSON.stringify(node.attributes || {}, null, 2)}</pre>
        </section>
      `;
    }

    function renderAll() {
      renderTraceList();
      renderHeader();
      renderGraph();
      renderDetail();
    }

    document.getElementById("olderBtn").addEventListener("click", () => {
      if (traceIndex < traces.length - 1) {
        traceIndex += 1;
        selectedNodeId = preferredNode(traces[traceIndex]);
        renderAll();
      }
    });

    document.getElementById("newerBtn").addEventListener("click", () => {
      if (traceIndex > 0) {
        traceIndex -= 1;
        selectedNodeId = preferredNode(traces[traceIndex]);
        renderAll();
      }
    });

    document.getElementById("latestBtn").addEventListener("click", () => {
      traceIndex = 0;
      selectedNodeId = preferredNode(traces[traceIndex]);
      renderAll();
    });

    selectedNodeId = preferredNode(traces[traceIndex]);
    renderAll();
  </script>
</body>
</html>
