<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animetta - Music Page Design</title>
  <style>
    :root {
      --c-bg: #1a1028;
      --c-surface: #241538;
      --c-panel: #2d1b45;
      --c-card: #36205a;
      --c-text: #e8e0f0;
      --c-text-dim: #9b8bb0;
      --c-text-muted: #6b5a80;
      --c-accent: #e879a8;
      --c-accent-hover: #f090c0;
      --c-accent-soft: rgba(232, 121, 168, 0.15);
      --c-blue: #7c8cf5;
      --c-success: #4ade80;
      --c-warning: #fbbf24;
      --c-error: #f87171;
      --c-gold: #f5c872;
      --c-border: rgba(255, 255, 255, 0.08);
      --c-border-accent: rgba(232, 121, 168, 0.30);
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-xl: 16px;
      --r-2xl: 20px;
      --s-1: 4px;
      --s-2: 8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 20px;
      --s-6: 24px;
      --d-fast: 150ms;
      --d-base: 200ms;
      --d-slow: 300ms;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans SC", sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background:
        radial-gradient(ellipse at 80% 20%, rgba(232, 121, 168, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(124, 140, 245, 0.06) 0%, transparent 50%),
        var(--c-bg);
    }

    /* TitleBar */
    .titlebar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--s-4);
      background: rgba(26, 16, 40, 0.80);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--c-border);
      z-index: 100;
    }

    .titlebar-left { display: flex; align-items: center; gap: var(--s-2); }
    .traffic-lights { display: flex; gap: var(--s-2); }
    .traffic-lights span { width: 12px; height: 12px; border-radius: 50%; }
    .traffic-lights .close { background: #ff5f57; }
    .traffic-lights .minimize { background: #febc2e; }
    .traffic-lights .maximize { background: #28c840; }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; margin-left: var(--s-3); }
    .brand-dot { color: var(--c-accent); }
    .titlebar-center { display: flex; gap: var(--s-1); }
    .nav-btn {
      padding: var(--s-1_5) var(--s-3);
      font-size: 12px;
      color: var(--c-text-dim);
      background: transparent;
      border: none;
      border-radius: var(--r-md);
      cursor: pointer;
      transition: all var(--d-base) var(--ease-out-expo);
    }
    .nav-btn:hover { color: var(--c-text); background: rgba(255, 255, 255, 0.04); }
    .nav-btn.active { color: var(--c-accent); background: var(--c-accent-soft); }
    .titlebar-right { display: flex; align-items: center; gap: var(--s-2); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-success); box-shadow: 0 0 8px rgba(74, 222, 128, 0.6); }
    .status-text { font-size: 10px; color: var(--c-text-dim); font-family: monospace; }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding: var(--s-3);
      gap: var(--s-3);
    }

    /* Music Page */
    .music-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--s-6);
      padding: var(--s-6);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      max-width: 480px;
    }

    .hero-icon {
      font-size: 48px;
      margin-bottom: var(--s-4);
    }

    .hero-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--c-text);
      margin-bottom: var(--s-2);
    }

    .hero-desc {
      font-size: 14px;
      color: var(--c-text-dim);
      line-height: 1.5;
    }

    /* Input Card */
    .input-card {
      width: 100%;
      max-width: 560px;
      background: rgba(36, 21, 56, 0.70);
      backdrop-filter: blur(20px);
      border: 1px solid var(--c-border);
      border-radius: var(--r-xl);
      padding: var(--s-5);
    }

    .input-row {
      display: flex;
      gap: var(--s-3);
    }

    .input-field {
      flex: 1;
      padding: var(--s-3) var(--s-4);
      font-size: 14px;
      color: var(--c-text);
      background: rgba(26, 16, 40, 0.40);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      outline: none;
      transition: all var(--d-base) var(--ease-out-expo);
      font-family: inherit;
    }

    .input-field::placeholder {
      color: var(--c-text-muted);
    }

    .input-field:focus {
      border-color: var(--c-border-accent);
      box-shadow: 0 0 0 3px var(--c-accent-soft);
    }

    .submit-btn {
      padding: var(--s-3) var(--s-5);
      font-size: 14px;
      font-weight: 500;
      background: linear-gradient(135deg, var(--c-accent), var(--c-accent-hover));
      color: white;
      border: none;
      border-radius: var(--r-lg);
      cursor: pointer;
      transition: all var(--d-base) var(--ease-out-expo);
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(232, 121, 168, 0.3);
    }

    .submit-btn:hover {
      box-shadow: 0 4px 20px rgba(232, 121, 168, 0.5);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Error Message */
    .error-msg {
      margin-top: var(--s-3);
      padding: var(--s-2) var(--s-3);
      font-size: 12px;
      color: var(--c-error);
      background: rgba(248, 113, 113, 0.10);
      border: 1px solid rgba(248, 113, 113, 0.30);
      border-radius: var(--r-md);
    }

    /* Recent Works */
    .recent-section {
      width: 100%;
      max-width: 560px;
    }

    .recent-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--c-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: var(--s-3);
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: var(--s-2);
    }

    .recent-item {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      padding: var(--s-3);
      background: rgba(26, 16, 40, 0.40);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      transition: all var(--d-base) var(--ease-out-expo);
    }

    .recent-item:hover {
      background: rgba(26, 16, 40, 0.60);
      border-color: var(--c-border-accent);
    }

    .recent-play {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--c-accent-soft);
      border-radius: 50%;
      color: var(--c-accent);
      cursor: pointer;
      transition: all var(--d-base) var(--ease-out-expo);
      flex-shrink: 0;
    }

    .recent-play:hover {
      background: var(--c-accent);
      color: white;
      transform: scale(1.1);
    }

    .recent-info {
      flex: 1;
      min-width: 0;
    }

    .recent-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--c-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-duration {
      font-size: 11px;
      color: var(--c-text-muted);
      margin-top: 2px;
    }

    .recent-actions {
      display: flex;
      gap: var(--s-2);
      flex-shrink: 0;
    }

    .recent-btn {
      padding: var(--s-1) var(--s-2);
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: all var(--d-base) var(--ease-out-expo);
    }

    .recent-btn.download {
      background: var(--c-accent-soft);
      color: var(--c-accent);
      border-color: var(--c-border-accent);
    }

    .recent-btn.download:hover {
      background: var(--c-accent);
      color: white;
    }

    .recent-btn.subtitle {
      background: rgba(255, 255, 255, 0.06);
      color: var(--c-text-dim);
    }

    .recent-btn.subtitle:hover {
      color: var(--c-text);
      background: rgba(255, 255, 255, 0.10);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- TitleBar -->
    <div class="titlebar">
      <div class="titlebar-left">
        <div class="traffic-lights">
          <span class="close"></span>
          <span class="minimize"></span>
          <span class="maximize"></span>
        </div>
        <div class="brand">Anima<span class="brand-dot">.</span></div>
      </div>
      <div class="titlebar-center">
        <button class="nav-btn active">Music</button>
        <button class="nav-btn">Meme</button>
        <button class="nav-btn">Dashboard</button>
      </div>
      <div class="titlebar-right">
        <span class="status-dot"></span>
        <span class="status-text">Connected</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Music Page -->
      <div class="music-page">
        <!-- Hero Section -->
        <div class="hero">
          <div class="hero-icon">🎵</div>
          <div class="hero-title">音乐制作</div>
          <div class="hero-desc">输入B站视频链接，AI自动完成人声替换</div>
        </div>

        <!-- Input Card -->
        <div class="input-card">
          <div class="input-row">
            <input
              type="text"
              class="input-field"
              placeholder="📎 贴上 B站 视频链接..."
            />
            <button class="submit-btn">开始制作</button>
          </div>
        </div>

        <!-- Recent Works -->
        <div class="recent-section">
          <div class="recent-title">最近作品</div>
          <div class="recent-list">
            <!-- Recent Item 1 -->
            <div class="recent-item">
              <div class="recent-play">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5,3 19,12 5,21" />
                </svg>
              </div>
              <div class="recent-info">
                <div class="recent-name">夜に駆ける - YOASOBI</div>
                <div class="recent-duration">4:23</div>
              </div>
              <div class="recent-actions">
                <button class="recent-btn download">DL</button>
                <button class="recent-btn subtitle">Sub</button>
              </div>
            </div>

            <!-- Recent Item 2 -->
            <div class="recent-item">
              <div class="recent-play">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5,3 19,12 5,21" />
                </svg>
              </div>
              <div class="recent-info">
                <div class="recent-name">群青 - YOASOBI</div>
                <div class="recent-duration">3:56</div>
              </div>
              <div class="recent-actions">
                <button class="recent-btn download">DL</button>
                <button class="recent-btn subtitle">Sub</button>
              </div>
            </div>

            <!-- Recent Item 3 -->
            <div class="recent-item">
              <div class="recent-play">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5,3 19,12 5,21" />
                </svg>
              </div>
              <div class="recent-info">
                <div class="recent-name">アイドル - YOASOBI</div>
                <div class="recent-duration">3:32</div>
              </div>
              <div class="recent-actions">
                <button class="recent-btn download">DL</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
