    include_in_full: true
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [frontend-toolchain, frontend-runtime]

  frontend-lint:
    domain: frontend
    kind: lint
    runner: pnpm
    cwd: frontend
    args: [lint]
    timeout_seconds: 300
    include_in_full: true
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [frontend-toolchain, frontend-runtime]

  frontend-format:
    domain: frontend
    kind: lint
    runner: pnpm
    cwd: frontend
    args: [format:check]
    timeout_seconds: 300
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [frontend-toolchain, frontend-runtime]

  frontend-deadcode:
    domain: frontend
    kind: lint
    runner: pnpm
    cwd: frontend
    args: [deadcode]
    timeout_seconds: 300
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [frontend-toolchain, frontend-runtime]

  frontend-duplicates:
    domain: frontend
    kind: lint
    runner: pnpm
    cwd: frontend
    args: [duplicates:check]
    timeout_seconds: 300
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [frontend-toolchain, frontend-runtime]

  frontend-typecheck:
    domain: frontend
    kind: typecheck
    runner: pnpm
    cwd: frontend
    args: [typecheck]
    timeout_seconds: 300
    include_in_full: true
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [frontend-toolchain, frontend-runtime]

  frontend-build:
    domain: frontend
