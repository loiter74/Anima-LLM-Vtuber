    kind: unit
    runner: pytest
    targets: [tests/acceptance]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]
    covers: [livestream-continuity-contract]

  livestream-continuity-contract:
    domain: backend
    kind: contract
    runner: pytest
    targets: [tests/acceptance/test_livestream_conversation_continuity.py]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 180
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-avatar-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/avatar]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 180
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-route-smoke:
    domain: backend
    kind: smoke
    runner: python
    entrypoint: scripts/route_smoke.py
    timeout_seconds: 120
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-runtime]

  backend-events-contract:
    domain: repository
    kind: contract
    runner: python
    entrypoint: scripts/validate-events.py
    timeout_seconds: 120
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-runtime, frontend-runtime]

  security-secrets:
    domain: repository
    kind: contract
    runner: python
    entrypoint: scripts/check_secrets.py
    timeout_seconds: 120
    include_in_full: true
    resource_class: light
    resource_weight: 1

  docs-contract:
    domain: repository
    kind: contract
    runner: pytest
    targets:
      - tests/smoke/test_readme_alignment.py
      - tests/smoke/test_frontend_agents_docs.py
    args: [-q, -o, addopts=]
    timeout_seconds: 120
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, documentation-source]

  backend-full:
    domain: backend
    kind: contract
    runner: pytest
    targets: [tests]
    args:
      - -q
      - -o
      - addopts=
      - -m
      - not slow and not integration
      - --tb=short
      - -n
      - "8"
      - --timeout=30
      - --timeout-method=thread
      - --cov=src/animetta
      - --cov-report=term-missing
      - --cov-report=xml
      - --cov-fail-under=75
    timeout_seconds: 1800
    artifacts: [coverage.xml]
    include_in_full: true
    cacheable: true
    resource_class: heavy
    resource_weight: 8
    input_sets: [python-toolchain, python-runtime]
    covers:
      - backend-core-unit
      - backend-config-unit
      - backend-server-unit
      - backend-graph-unit
      - backend-services-unit
      - singing-model-workspace-unit
      - backend-memory-unit
      - backend-tools-unit
      - minecraft-contract-unit
      - minecraft-voyager-unit
      - minecraft-domain-unit
      - minecraft-runtime-unit
      - minecraft-adaptive-mission-unit
      - minecraft-world-discovery-unit
      - minecraft-cross-runtime-contract
      - minecraft-presentation-artifacts
      - backend-observability-unit
      - backend-acceptance-unit
      - livestream-continuity-contract
      - backend-avatar-unit
      - agent-security-unit
      - agent-recovery-unit
      - agent-approval-unit
      - agent-trajectory-unit
      - agent-cost-unit

  backend-deadcode:
    domain: repository
    kind: lint
    runner: vulture
    targets: [tooling, scripts, evaluations, src/animetta, src/animetta_qwen_tts]
    args: [--min-confidence, "80"]
    timeout_seconds: 300
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
