    domain: repository
    kind: smoke
    runner: docker
    isolation: hermetic
    args: [compose, -f, docker-compose.yml, config, --quiet, --no-interpolate]
    capabilities: [docker]
    timeout_seconds: 180
    include_in_full: true
    include_in_nightly: true
    resource_class: exclusive
    resource_weight: 8

  operational-source-contract:
    domain: repository
