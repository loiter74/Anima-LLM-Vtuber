schema_version: 1

quick_groups: [backend-route-smoke]

input_sets:
  quality-engine:
    paths:
      - tooling/quality/**
      - tooling/execution_feedback/**
      - tooling/quality.yml
  python-toolchain:
    paths:
      - pyproject.toml
      - requirements*.txt
  python-runtime:
    paths:
      - src/**/*.py
      - config/**/*.yaml
  python-maintained-source:
    paths:
      - src/**/*.py
      - tooling/**/*.py
      - scripts/**/*.py
      - evaluations/**/*.py
      - tests/**/*.py
  singing-model-workspace:
    paths:
      - songs/**
      - scripts/train/**
      - tests/scripts/train/**
      - docs/development/rvc-training-guide.md
  agent-skills:
    paths:
      - .agents/skills/**
      - tests/agent_skills/**
  bilibili-mcp-runtime:
    paths:
      - tooling/bilibili_mcp/**
      - tests/mcp/bilibili/**
      - config/socket-events.json
  livestream-evaluation-runtime:
    paths:
      - evaluations/livestream/**
      - tests/evaluations/livestream/**
      - src/animetta/services/bilibili/**
  agent-evaluation-runtime:
    paths:
      - evaluations/agent/**
      - tests/evaluations/agent/**
      - src/animetta/services/llm/usage.py
      - src/animetta/config/providers/llm/pricing.py
  frontend-toolchain:
    paths:
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - frontend/knip.json
      - frontend/vite.config.ts
      - frontend/vitest.config.ts
      - frontend/tsconfig*.json
      - frontend/uno.config.ts
  frontend-runtime:
    paths:
      - frontend/src/**
      - frontend/tests/**
      - frontend/public/**
      - frontend/electron/**
      - frontend/scripts/**
      - frontend/*.mjs
      - frontend/*.ts
  mc-mcp-runtime:
    paths:
      - services/mc-mcp/**
      - contracts/gamebot/v2/**
  operational-source:
    paths:
      - scripts/check_source_standards.py
      - Dockerfile*
      - "**/Dockerfile*"
      - "**/*.sh"
      - "**/*.ps1"
      - "**/*.bat"
      - "**/*.cmd"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/*.toml"
  documentation-source:
    paths:
      - README*.md
      - CONTRIBUTING.md
      - AGENTS.md
      - tests/AGENTS.md
      - .github/assets/**
      - docs/**

default_input_sets: [quality-engine]

scheduler:
  max_workers: 6
  max_weight: 8
  max_heavy: 1
  max_exclusive: 1

docker_watch_paths:
  - .dockerignore
  - Dockerfile*
  - docker-compose*.yml
  - docker/entrypoint.sh
  - docker/nginx.conf
  - requirements.txt
  - frontend/package.json
  - frontend/pnpm-lock.yaml
  - frontend/src/**
  - frontend/public/**
  - src/animetta/**
  - config/**

docker_scopes:
  animetta:
    service: animetta
    compose_file: docker-compose.yml
    environment_identity_fields:
      - ANIMETTA_IMAGE
      - ANIMETTA_PROFILE
      - ANIMETTA_HOST
      - ANIMETTA_PORT
      - DEEPSEEK_API_KEY
      - DASHSCOPE_API_KEY
      - MIMO_API_KEY
      - QWEN_TTS_API_KEY
      - QWEN_HOST_TTS_URL
      - RVC_HOST_URL
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker/entrypoint.sh
      - docker/nginx.conf
      - requirements.txt
      - frontend/**
      - src/animetta/**
      - config/**
      - scripts/**
      - .env.example
groups:
  python-format:
    domain: repository
    kind: lint
    runner: ruff-format
    targets: [src, tooling, scripts, evaluations, tests]
    args: [--check]
    timeout_seconds: 180
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-maintained-source]

  backend-static:
    domain: backend
    kind: lint
    runner: ruff
    targets: [src, tooling, scripts, evaluations, tests]
    timeout_seconds: 180
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-maintained-source]

  backend-typecheck:
    domain: backend
    kind: typecheck
    runner: mypy
    targets: [src/animetta, src/animetta_qwen_tts]
    args: [--ignore-missing-imports]
    timeout_seconds: 300
    include_in_full: true
    cacheable: true
    resource_class: cpu
    resource_weight: 3
    input_sets: [python-toolchain]

  backend-support-typecheck:
    domain: repository
    kind: typecheck
    runner: mypy
    targets: [tooling/quality, scripts, evaluations]
    args: [--ignore-missing-imports]
    timeout_seconds: 180
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-maintained-source]

  backend-tooling-quality:
    domain: repository
    kind: unit
    runner: pytest
    targets: [tests/tooling/quality, tests/tooling/execution_feedback]
    args: [-q, -o, addopts=]
    timeout_seconds: 240
    include_in_full: true
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  bilibili-mcp-unit:
    domain: repository
    kind: unit
    runner: pytest
    targets: [tests/mcp/bilibili]
    args: [-q, -o, addopts=]
    timeout_seconds: 60
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, bilibili-mcp-runtime]

  livestream-evaluation-unit:
    domain: repository
    kind: unit
    runner: pytest
    targets: [tests/evaluations/livestream]
    args: [-q, -o, addopts=]
    timeout_seconds: 180
    include_in_full: true
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain, livestream-evaluation-runtime]

  agent-skill-format:
    domain: repository
    kind: lint
    runner: ruff-format
    targets: [.agents/skills, tests/agent_skills]
    args: [--check]
    timeout_seconds: 60
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, agent-skills]

  agent-skill-static:
    domain: repository
    kind: lint
    runner: ruff
    targets: [.agents/skills, tests/agent_skills]
    timeout_seconds: 60
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, agent-skills]

  agent-skill-regression:
    domain: repository
    kind: unit
    runner: pytest
    targets: [tests/agent_skills]
    args: [-q, -o, addopts=]
    timeout_seconds: 60
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, agent-skills]

  runtime-lifecycle-unit:
    domain: repository
    kind: unit
    runner: pytest
    targets:
      - tests/scripts/test_runtime_lifecycle.py
      - tests/scripts/test_runtime_lifecycle_feedback.py
      - tests/scripts/test_qwen_preflight.py
      - tests/scripts/test_rvc_preflight.py
      - tests/scripts/test_benchmark_host_tts.py
      - tests/scripts/test_release_runtime_gate.py
    args: [-q, -o, addopts=]
    timeout_seconds: 240
    include_in_full: true
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  host-tts-contract-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets:
      - tests/config/test_runtime_manifest.py
      - tests/services/tts/test_qwen_gguf_host_engine.py
      - tests/scripts/test_qwen_preflight.py
      - tests/scripts/test_benchmark_host_tts.py
    args: [-q, -o, addopts=]
    timeout_seconds: 120
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  host-rvc-contract-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets:
      - tests/services/singing/test_rvc_host_app.py
      - tests/services/singing/test_rvc_host_engine.py
      - tests/services/singing/test_rvc_bridge.py
      - tests/services/singing/test_svc_pipeline_rvc.py
