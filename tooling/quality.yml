    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-config-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/config]
    args: [-q, -o, addopts=, -m, not slow and not integration]
