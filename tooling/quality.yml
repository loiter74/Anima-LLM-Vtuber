    runner: pnpm
    cwd: frontend
    args: [build]
    timeout_seconds: 420
    artifacts: [frontend/dist]
    include_in_full: true
    cacheable: true
    resource_class: heavy
    resource_weight: 4
    input_sets: [frontend-toolchain, frontend-runtime]

  frontend-playwright-smoke:
    domain: frontend
    kind: e2e
    runner: playwright
    isolation: service
    cwd: frontend
    entrypoint: smoke-test.mjs
    capabilities: [browser]
    timeout_seconds: 600
    artifacts: [smoke-test-homepage.png]
    required: false
    include_in_nightly: true
    resource_class: exclusive
    resource_weight: 8
    input_sets: [frontend-toolchain, frontend-runtime]

