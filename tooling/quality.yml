      - tests/core/test_redis_checkpoint.py
      - tests/orchestration/graph/test_builder.py
      - tests/orchestration/graph/test_orchestrator.py
      - tests/services/test_command_inbox.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 240
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  agent-approval-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets:
      - tests/orchestration/graph/test_tool_approval.py
      - tests/orchestration/server/test_tool_approval_routes.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 180
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain]

  agent-trajectory-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets: [tests/evaluations/agent/test_agent_evaluation.py]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 180
    include_in_nightly: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, agent-evaluation-runtime]

  agent-cost-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets:
      - tests/services/llm/test_usage.py
      - tests/evaluations/agent/test_agent_evaluation.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 180
    include_in_nightly: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, agent-evaluation-runtime]

  persona-config-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets:
      - tests/config/test_persona.py
      - tests/orchestration/graph/test_anima_v01_regression.py
      - tests/orchestration/graph/test_prompt_pipeline.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-server-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/orchestration/server]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-graph-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets: [tests/orchestration/graph]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 420
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-services-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets:
      - tests/services
      - tests/smoke/test_singing_pipeline.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 420
    cacheable: true
    resource_class: cpu
    resource_weight: 3
    input_sets: [python-toolchain]

  singing-model-workspace-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/scripts/train]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 120
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-maintained-source, singing-model-workspace]

  backend-memory-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/memory_v2]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-tools-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/tools]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 600
    cacheable: true
    resource_class: cpu
    resource_weight: 3
    input_sets: [python-toolchain]

  mc-mcp-node-contract:
    domain: backend
    kind: contract
    runner: npm
    cwd: services/mc-mcp
    args: [ci, "::", run, test:contract]
    timeout_seconds: 300
    resource_class: cpu
    resource_weight: 2
    input_sets: [mc-mcp-runtime]

  mc-mcp-node-quality:
    domain: backend
    kind: unit
    runner: npm
    cwd: services/mc-mcp
    args: [ci, "::", run, check, "::", test]
    timeout_seconds: 600
    include_in_full: true
    resource_class: cpu
    resource_weight: 3
    input_sets: [mc-mcp-runtime]
    covers: [mc-mcp-node-contract]

  minecraft-contract-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets: [tests/tools/minecraft/core/test_gamebot_v2_adapter.py]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 180
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain]

  minecraft-voyager-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/tools/minecraft/voyager]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  minecraft-domain-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets:
      - tests/tools/minecraft/skill
      - tests/tools/minecraft/survival
      - tests/tools/minecraft/tech_tree
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  minecraft-runtime-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets:
      - tests/tools/minecraft/core
      - tests/orchestration/server/handlers/test_minecraft_voyager_wiring.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  minecraft-architecture-audit:
    domain: repository
    kind: contract
    runner: python
    entrypoint: scripts/check_minecraft_architecture.py
    args: [--check]
    timeout_seconds: 120
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-maintained-source]

  architecture-boundary-audit:
    domain: repository
    kind: contract
    runner: python
    entrypoint: scripts/check_architecture_boundaries.py
    args: [--check]
    timeout_seconds: 120
    include_in_full: true
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain, python-maintained-source, frontend-runtime]

  minecraft-adaptive-mission-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets:
      - tests/tools/minecraft/mission
      - tests/tools/minecraft/showcase
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  minecraft-world-discovery-unit:
    domain: backend
    kind: unit
    runner: pytest
    targets: [tests/tools/minecraft/discovery]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  minecraft-cross-runtime-contract:
    domain: backend
    kind: contract
    runner: pytest
    targets:
      - tests/tools/gamebot/contracts/v2
      - tests/tools/minecraft/core/test_gamebot_v2_adapter.py
      - tests/tools/minecraft/voyager/test_mocked_cross_runtime.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  minecraft-real-conversation:
    domain: repository
    kind: integration
    runner: python
    isolation: service
    entrypoint: scripts/minecraft_real_model_contract.py
    capabilities: [network]
    timeout_seconds: 900
    required: false
    include_in_nightly: true
    resource_class: exclusive
    resource_weight: 8

  minecraft-real-showcase:
    domain: repository
    kind: e2e
    runner: python
    isolation: service
    entrypoint: scripts/minecraft_adaptive_showcase.py
    capabilities: [browser, docker, network, gpu]
    timeout_seconds: 1200
    artifacts:
      - evidence/minecraft-adaptive-showcase/manifest.json
      - evidence/minecraft-adaptive-showcase/screenshots
      - evidence/minecraft-adaptive-showcase/showcase.mp4
    required: false
    include_in_nightly: true
    resource_class: exclusive
    resource_weight: 8

  minecraft-presentation-artifacts:
    domain: backend
    kind: contract
    runner: pytest
    targets:
      - tests/tools/minecraft/showcase/test_presentation.py
      - tests/tools/minecraft/showcase/test_runner.py
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 180
    cacheable: true
    resource_class: light
    resource_weight: 1
    input_sets: [python-toolchain]

  backend-observability-unit:
    domain: backend
    kind: contract
    runner: pytest
    targets: [tests/observability, tests/tracing, tests/inspection]
    args: [-q, -o, addopts=, -m, not slow and not integration]
    timeout_seconds: 300
    cacheable: true
    resource_class: cpu
    resource_weight: 2
    input_sets: [python-toolchain]

  backend-acceptance-unit:
