# ============================================
# Animetta 配置文件
# ============================================

# 人设: default / anima.v0.1
persona: "anima.v0.1"

# ============================================
# 服务组合配置
# ============================================
# 通过名称引用 config/services.yaml 中的服务配置
# 例如: asr: mock 会加载 services.yaml 中 asr.mock 的配置

services:
  asr: mock  # 使用 mock ASR（funasr 未安装）
  # asr: mimo-asr   # 小米 MiMo ASR（MIMO_API_KEY）
  tts: mock   # 测试用，无 TTS 依赖
  # tts: mimo-tts   # 小米 MiMo TTS（MIMO_API_KEY）
  # tts: alice_vc   # 有珠 Qwen TTS 声音克隆
  agent: deepseek  # 底座LLM（测试用，DEEPSEEK_API_KEY 可用）
  # agent: mimo  # 底座LLM：小米 MiMo Pro 2
  # local_llm: local_lora  # 本地LLM：LocalLoraLLM（简单应答，无persona，保留LoRA效果）- 已禁用
  vad: silero   # vad: silero / mock
  # vad: mimo-vad   # 小米 MiMo VAD（本地端点 + MiMo ASR 确认）

# ============================================
# 系统配置
# ============================================
system:
  host: "0.0.0.0"
  port: 12394
  debug: true
  log_level: "INFO"

  # GPT-SoVITS 本地推理服务路径配置
  # 使用 tts: gpt_sovits* 时需要启动 api_v2.py 服务
  gpt_sovits:
    path: "${GPT_SOVITS_PATH:}"           # GPT-SoVITS 仓库路径（环境变量）
    python: "${GPT_SOVITS_PYTHON:python}"  # Python 解释器路径（默认系统 python）
    port: 9880      # api_v2.py 监听端口

# 本地观测账本是事实源；Prometheus/OTLP 仅做单向镜像。
observability:
  enabled: true
  database_path: "data/observations.db"
  queue_capacity: 4096
  busy_timeout_ms: 5000
  drain_timeout_seconds: 5.0
  privacy:
    development: full
    golden: redacted
    production: redacted
    digest_salt: "animetta-local-observation"
  prometheus:
    enabled: true
  otlp:
    enabled: false
    endpoint: null
    max_export_batch_size: 512
    schedule_delay_millis: 5000
