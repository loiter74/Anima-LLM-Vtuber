# Bilibili 直播弹幕配置
# 真实房间号属于个人信息：写入 config/bilibili.local.yaml（已 gitignore），
# 此模板保持 room_id: 0。
enabled: false
room_id: 0
sessdata: ""

reply_policy:
  enabled: true
  mode: exhaustive
  max_replies_per_minute: 60
  max_queue_size: 100
  generation_concurrency: 2
  max_message_age_seconds: 300
  per_user_cooldown_seconds: 0
  duplicate_window_seconds: 0
  ordinary_sample_rate: 1.0
  reply_to_gifts: true
  reply_to_super_chat: true
