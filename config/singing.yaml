# Animetta 唱歌模块配置
# 唱歌模块使用独立的人物模型和音频处理管线，与主对话运行时分离。
# singing.yaml 的 rvc/separation 配置用于歌曲转换和伴奏分离，
# 主对话服务选择统一由 animetta.yaml 管理。
singing:
  asr:
    download_root: E:/animetta_data/models/whisper
    language: null
    model_size: large-v3
    output_dir: ./data/singing/lyrics
  bilibili:
    downloader: yt-dlp
    output_dir: ./data/singing/downloads
  gpt_sovits:
    base_url: http://127.0.0.1:9880
    prompt_text: ''
    ref_audio_path: ''
    speed: 1.0
    svc_endpoint: /svc
    temperature: 1.0
    text_lang: zh
    text_split_method: cut5
    top_k: 15
    top_p: 1.0
  max_file_age_days: 7
  output_dir: ./data/singing/outputs
  playlist:
    - id: make-debut
      title: Make debut!
      performer: 待兼诗歌剧
      role: 开场
      note: 轻快入场，适合建立第一轮互动。
      url: https://www.bilibili.com/video/BV1Lr4y1W7Gn?p=1
    - id: pyoi-hareluya
      title: ぴょいっと♪はれるや!
      performer: 待兼诗歌剧
      role: 热场
      note: 节奏明亮，放在开场后继续升温。
      url: https://www.bilibili.com/video/BV1Lr4y1W7Gn?p=6
    - id: tailwind
      title: TAILWIND
      performer: 待兼诗歌剧
      role: 主打
      note: 角色独唱，作为整场核心曲目。
      url: https://www.bilibili.com/video/BV1ow411P7sz
    - id: uma-pyoi-densetsu
      title: うまぴょい伝説!
      performer: 待兼诗歌剧
      role: 互动
      note: 适合弹幕跟唱和中段互动。
      url: https://www.bilibili.com/video/BV1Lr4y1W7Gn?p=2
    - id: girls-legend-u
      title: GIRLS' LEGEND U!
      performer: 待兼诗歌剧
      role: 推进
      note: 加快节奏，承接中段互动。
      url: https://www.bilibili.com/video/BV1Lr4y1W7Gn?p=5
    - id: yume-wo-kakeru
      title: ユメヲカケル!
      performer: 待兼诗歌剧
      role: 高潮
      note: 情绪上扬，适合后半场高潮。
      url: https://www.bilibili.com/video/BV1Lr4y1W7Gn?p=3
    - id: gaze-on-me
      title: Gaze on Me!
      performer: 待兼诗歌剧
      role: 舞台
      note: 舞台感强，用于高潮后的变化段。
      url: https://www.bilibili.com/video/BV1Lr4y1W7Gn?p=4
    - id: iro-dori-phantasia
      title: 彩 Phantasia
      performer: 待兼诗歌剧
      role: 收尾
      note: 旋律舒展，作为歌单收束。
      url: https://www.bilibili.com/video/BV1Lr4y1W7Gn?p=8
  rvc:
    api_key_env: QWEN_TTS_API_KEY
    base_url: '${RVC_HOST_URL:http://host.docker.internal:8769}'
    enabled: true
    expected_revision: e2714bf076547117a24352943cb67d7766d6b512a163c4ecd26bd1e6abb54536
    f0_method: rmvpe
    f0_up_key: 0
    filter_radius: 5
    index_path: logs/tosaka_rin_tts_v1/added_IVF2143_Flat_nprobe_1_tosaka_rin_tts_v1_v2.index
    index_rate: 0.3
    model_name: tosaka_rin_tts_v1.pth
    protect: 0.5
    python_exe: ''
    request_timeout_seconds: 1200.0
    required: true
    rms_mix_rate: 0.5
    rvc_path: '${RVC_PATH:C:/Users/30262/RVC20240604Nvidia}'
  separation:
    api_key_env: QWEN_TTS_API_KEY
    base_url: '${RVC_HOST_URL:http://host.docker.internal:8769}'
    engine: host-demucs
    fallback_engine: ''
    model: htdemucs
    output_dir: ./data/singing/separated
    request_timeout_seconds: 1200.0
  svc:
    output_dir: ./data/singing/converted
