schema_version: 2

application:
  persona: anima.v0.1
  system:
    host: ${ANIMETTA_HOST}
    port: ${ANIMETTA_PORT}
  security:
    allowed_origins:
      - http://127.0.0.1
      - http://localhost
      - http://127.0.0.1:8000
      - http://localhost:8000
      - http://127.0.0.1:12394
      - http://localhost:12394
    access_token_env: ANIMETTA_ACCESS_TOKEN
    account_username_env: ANIMETTA_AUTH_USERNAME
    account_password_hash_env: ANIMETTA_AUTH_PASSWORD_HASH
    session_hours: 8
  observability:
    enabled: true
    database_path: data/observations.db
    queue_capacity: 4096
    busy_timeout_ms: 5000
    drain_timeout_seconds: 5.0
    privacy:
      test: full
      smoke: redacted
      selftest: redacted
      production: redacted
      digest_salt: animetta-local-observation
    prometheus:
      enabled: true
    otlp:
      enabled: false
      endpoint: null
      max_export_batch_size: 512
      schedule_delay_millis: 5000
  humor:
    enabled: false
  scene_analysis:
    mode: shadow
    reflection_interval_seconds: 30
    event_threshold: 30
    max_reflections_per_minute: 4
    guidance_wait_seconds: 0.3
    model_timeout_seconds: 5
    model_max_tokens: 800
  proactive_topics:
    enabled: true
    initial_silence_seconds: 60
    interval_min_seconds: 90
    interval_max_seconds: 180
    max_chars: 36

providers:
  llm:
    mock:
      type: mock
    deepseek:
      type: deepseek
      api_key: ${DEEPSEEK_API_KEY}
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      thinking: disabled
      temperature: 0.9
      top_p: 0.93
      max_tokens: 4096
      pricing:
        schema_version: 1
        currency: USD
        cached_input_per_million: 0.0028
        input_per_million: 0.14
        output_per_million: 0.28
        verified_on: 2026-08-15
        source: https://api-docs.deepseek.com/quick_start/pricing/

  asr:
    mock:
      type: mock
    mimo-asr:
      type: mimo
      api_key: ${MIMO_API_KEY}
      model: mimo-v2.5-asr
      base_url: https://api.xiaomimimo.com/v1
      language: auto
      sample_rate: 16000
      input_audio_format: pcm_s16le

  tts:
    mock:
      type: mock
      voice: default
    dashscope-seren: &dashscope-seren
      type: dashscope
      api_key: ${DASHSCOPE_API_KEY}
      model: qwen3-tts-instruct-flash-realtime
      voice: Seren
      base_url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
      response_format: pcm
      sample_rate: 24000
      language_type: Chinese
      timeout_seconds: 20.0
      connect_timeout_seconds: 5.0
    qwen-host: &qwen-host
      type: remote
      contract: host-tts
      api_key: ${QWEN_TTS_API_KEY}
      base_url: ${QWEN_HOST_TTS_URL}
    dashscope-local-failover:
      type: failover
      cooldown_seconds: 300.0
      primary_pre_audio_retries: 1
      primary: *dashscope-seren
      fallback: *qwen-host
    mimo-tts:
      type: mimo
      api_key: ${MIMO_API_KEY}
      model: mimo-v2.5-tts
      base_url: https://api.xiaomimimo.com/v1
      voice: mimo_default
      response_format: wav
  vad:
    mock:
      type: mock
      sample_rate: 16000
      db_threshold: -30.0
      min_speech_duration: 5
      min_silence_duration: 15
    mimo-vad:
      type: mimo
      api_key: ${MIMO_API_KEY}
      model: mimo-v2.5-asr
      base_url: https://api.xiaomimimo.com/v1
      language: auto
      sample_rate: 16000
      db_threshold: -35.0
      min_speech_duration: 2
      min_silence_duration: 8
      confirm_with_asr: true

profiles:
  test:
    services:
      llm: mock
      asr: mock
      tts: mock
      vad: mock
    policy:
      allow_mock: true
      require_remote_identity: false
    runtime:
      debug: true
      long_term_memory_mode: "off"
      enable_tools: false
      enable_subtitle_translation: false
      enable_active_memes: false
      tts_timeout_seconds: 5.0

  smoke:
    services:
      llm: deepseek
      asr: mimo-asr
      tts: qwen-host
      vad: mimo-vad
    policy:
      allow_mock: false
      require_remote_identity: true
    runtime:
      debug: false
      long_term_memory_mode: "off"
      enable_tools: false
      enable_subtitle_translation: false
      enable_active_memes: false
      tts_timeout_seconds: 120.0

  selftest:
    services:
      llm: deepseek
      asr: mimo-asr
      tts: qwen-host
      vad: mimo-vad
    policy:
      allow_mock: false
      require_remote_identity: true
    runtime:
      debug: false
      long_term_memory_mode: "off"
      enable_tools: false
      enable_subtitle_translation: false
      enable_active_memes: false
      tts_timeout_seconds: 120.0

  production:
    services:
      llm: deepseek
      asr: mimo-asr
      tts: dashscope-local-failover
      vad: mimo-vad
    policy:
      allow_mock: false
      require_remote_identity: true
    runtime:
      debug: false
      long_term_memory_mode: "off"
      enable_tools: true
      enable_subtitle_translation: false
      enable_active_memes: false
      tts_timeout_seconds: 20.0
