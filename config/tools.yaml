# Animetta 工具配置

# ========================================
# 内置工具（不需要 API Key）
# ========================================
builtin_tools:
  - web_search      # Tavily + DuckDuckGo 双 fallback 搜索
  - get_current_time # 获取时间
  - calculator      # 数学计算
  # - get_weather     # 需要 AMAP_API_KEY，否则返回模拟数据
  # - read_file       # 已由 MCP filesystem 替代，更安全
  # - list_directory  # 已由 MCP filesystem 替代，更安全

# ========================================
# LangChain 工具
# ========================================
langchain_tools:
  enabled: []
    # - python_repl     # 有安全风险，按需启用
    # - wikipedia       # 与 web_search 功能重叠
    # - ddg_search      # 与 web_search 的 fallback 重复

# ========================================
# 自定义工具
# ========================================
custom_tools:
  enabled: []
  # - url_preview     # 按需启用
  # - translate       # LLM 自身多语言能力足够
  # - send_email      # 需要 SMTP 配置
  # - image_gen       # 需要 OPENAI_API_KEY

# ========================================
# MCP 服务器
# 支持三种传输方式: stdio, sse, streamable_http
# ========================================
mcp_servers:
  - name: "filesystem"
    transport: "stdio"
    sandbox:
      type: "docker"
      image: "animetta-mcp-filesystem"
      mounts:
        - "./data:/data:rw"
      memory: "128m"
      cpus: "0.5"
    args: ["/data"]  # ENTRYPOINT 参数，容器内的允许目录

  # SSE 示例:
  # - name: "remote-search"
  #   transport: "sse"
  #   url: "http://localhost:8080/sse"

  # Streamable HTTP 示例:
  # - name: "remote-tools"
  #   transport: "streamable_http"
  #   url: "http://localhost:8080/mcp"

# ========================================
# Minecraft 游戏控制
# ========================================
minecraft:
  enabled: true                 # 已启用，AI 控制 Mineflayer Bot 自动连接
  mode: fallback                # fallback(默认,纯Survival Runner) | learn(Voyager学习期) | live(直播选技能)
  autonomous: true              # deprecated: 由 mode 派生，保留向后兼容
  bot:
    host: "localhost"
    port: 25565
    username: "AnimettaBot"
    version: "1.21"              # Match SpectatorPlus paper-1.2.1 / Fabric mc1.21
  safety:
    no_griefing: true           # 不破坏玩家建筑
    auto_heal: true             # 自动回血
    max_distance: 500           # 最大活动半径
  viewer:
    username: "LUN077"          # 旁观玩家：进入服务器 / bot 重连后自动 spectate 附身
    auto_spectate: true
  runtime:
    runtime_path: "C:/Users/30262/Project/voyager-mc-bot"   # 外部 voyager-mc-bot 项目
    entrypoint: "src/index.js"
    package_manager: "npm"
    use_embedded_fallback: false   # embedded runtime 已移除

# ========================================
# 工具调用设置
# ========================================
tool_settings:
  enable_tools: true
  max_tool_calls_per_turn: 5
  tool_execution_timeout: 30
  retry_on_failure: true
  max_retries: 2
  log_tool_calls: true
