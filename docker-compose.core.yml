services:
  animetta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ANIMETTA_BUILD_FINGERPRINT: ${ANIMETTA_BUILD_FINGERPRINT:-untracked}
    ports:
      - "80:80"
      - "${ANIMETTA_PORT:-12394}:12394"
    environment:
      - ANIMETTA_PROFILE=test
      - ANIMETTA_HOST=0.0.0.0
      - ANIMETTA_PORT=12394
    volumes:
      - animetta-memory-db:/app/memory_db
      - animetta-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  animetta-memory-db:
  animetta-data:
